<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>House Virtual Tour — 360°</title>
  <meta name="description" content="Explore our home with an immersive interactive 360° virtual tour." />
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Marzipano CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marzipano@0.10.2/dist/marzipano.js"></script>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- App styles -->
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    :root {
      --ink: #1b120c;
      --cream: #f9f4ef;
      --cream-dim: #ede5dd;
      --gold: #f4d03f;
      --gold-deep: #d4ac0d;
      --gold-pale: #fcf3cf;
      --maroon: #78281f;
      --white: #ffffff;
      --font-display: 'Luckiest Guy', cursive;
      --font-body: 'Baloo 2', sans-serif;
      --radius-md: 16px;
      --radius-sm: 8px;
      --shadow-ink-sm: 3px 3px 0 var(--ink);
      --shadow-ink: 5px 5px 0 var(--ink);
    }
    /* ── Guest-specific overrides ── */
    body { background: #000; overflow: hidden; font-family: var(--font-body); }

    #guest-shell {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    /* Full-screen 360 canvas */
    #pano-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #pano-container:active { cursor: grabbing; }

    /* Floating top bar */
    #guest-topbar {
      position: absolute;
      top: 1rem; left: 1rem;
      z-index: 200;
      display: flex;
      align-items: center;
      background: var(--cream);
      border: 3px solid var(--ink);
      box-shadow: var(--shadow-ink-sm);
      border-radius: var(--radius-md);
      padding: 0.5rem 1.25rem;
      pointer-events: auto;
    }
    #guest-topbar .tour-title {
      font-family: var(--font-display);
      font-size: 20px;
      color: var(--maroon);
      letter-spacing: .5px;
      line-height: 1.2;
    }
    #guest-topbar .tour-title span {
      color: var(--gold-deep);
      -webkit-text-stroke: .5px var(--ink);
    }
    #guest-topbar .tour-subtitle {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 13px;
      color: var(--ink);
      margin-top: 1px;
    }

    /* Floating room name badge (current room) */
    #current-room-badge {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: var(--gold);
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 0.4rem 1.4rem;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 0.95rem;
      box-shadow: var(--shadow-ink-sm);
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    /* Room navigation menu (bottom right) */
    #room-nav-container {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      z-index: 200;
    }

    #btn-toggle-rooms {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--white);
      border: 2.5px solid var(--ink);
      color: var(--ink);
      box-shadow: var(--shadow-ink-sm);
      font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    #btn-toggle-rooms:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--ink);
      background: var(--gold-pale);
    }

    .guest-room-nav {
      position: absolute;
      bottom: 56px;
      right: 0;
      background: var(--white);
      border: 3px solid var(--ink);
      border-radius: var(--radius-md);
      padding: 0.6rem;
      min-width: 220px;
      max-width: 280px;
      max-height: 60vh;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 0.35rem;
      box-shadow: var(--shadow-ink);
    }
    .guest-room-nav.open { display: flex; }

    .guest-room-btn {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.6rem 0.8rem;
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--ink);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
    }
    .guest-room-btn:hover {
      background: var(--cream-dim);
      border-color: var(--ink);
    }
    .guest-room-btn.active {
      background: var(--gold-pale);
      border-color: var(--ink);
      color: var(--maroon);
      font-weight: 800;
    }
    .guest-room-btn i { font-size: 0.95rem; color: var(--maroon); flex-shrink: 0; }

    /* Loading overlay */
    #guest-loading {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--cream);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.2rem;
      transition: opacity 0.4s ease;
      background-image: radial-gradient(circle, rgba(27, 18, 12, 0.06) 1.4px, transparent 1.4px);
      background-size: 22px 22px;
    }
    #guest-loading.fade-out { opacity: 0; pointer-events: none; }
    #guest-loading .loading-logo img { width: 80px; height: 80px; object-fit: contain; }
    #guest-loading .loading-text {
      color: var(--maroon);
      font-family: var(--font-display);
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }
    #guest-loading .spinner-border {
      width: 2.5rem; height: 2.5rem;
      color: var(--maroon);
      border-width: 0.25em;
    }

    /* Autorotate button */
    #btn-guest-autorotate {
      position: absolute;
      top: 1rem; right: 1rem;
      z-index: 200;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--white);
      border: 2.5px solid var(--ink);
      color: var(--ink);
      box-shadow: var(--shadow-ink-sm);
      font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    #btn-guest-autorotate:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--ink);
      background: var(--gold-pale);
    }
    #btn-guest-autorotate.active {
      background: var(--gold);
    }

    /* Audio button */
    #btn-guest-audio {
      position: absolute;
      top: 1rem; right: 7.5rem;
      z-index: 200;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--white);
      border: 2.5px solid var(--ink);
      color: var(--ink);
      box-shadow: var(--shadow-ink-sm);
      font-size: 1.25rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    #btn-guest-audio:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--ink);
      background: var(--gold-pale);
    }
    #btn-guest-audio.playing {
      background: var(--gold);
    }

    /* Comment button */
    #btn-guest-comments {
      position: absolute;
      top: 1rem; right: 4.25rem;
      z-index: 200;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--white);
      border: 2.5px solid var(--ink);
      color: var(--ink);
      box-shadow: var(--shadow-ink-sm);
      font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    #btn-guest-comments:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--ink);
      background: var(--gold-pale);
    }
    #btn-guest-comments.active {
      background: var(--gold);
    }

    /* Comments Panel */
    .guest-comments-panel {
      position: absolute;
      top: 5rem;
      right: 1rem;
      bottom: 5rem;
      width: 320px;
      background: var(--white);
      border: 3px solid var(--ink);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-ink);
      z-index: 200;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .guest-comments-panel.open { display: flex; }

    .panel-header {
      padding: 0.75rem 1rem;
      border-bottom: 2.5px solid var(--ink);
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-header h5 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--maroon);
      margin: 0;
      letter-spacing: 0.5px;
    }
    .panel-header button {
      background: none; border: none; cursor: pointer; color: var(--ink); font-size: 1rem;
    }

    .panel-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0.8rem;
      overflow: hidden;
    }

    .comments-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--ink) transparent;
    }
    .comments-list::-webkit-scrollbar { width: 4px; }
    .comments-list::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 4px; }

    .comment-item {
      background: var(--cream);
      border: 2px solid var(--ink);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.7rem;
      font-family: var(--font-body);
      font-size: 0.85rem;
      line-height: 1.3;
    }
    .comment-meta {
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      color: var(--maroon);
      margin-bottom: 0.15rem;
      font-size: 0.82rem;
    }
    .comment-time {
      font-weight: 500;
      color: #7a6752;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- Loading overlay -->
  <div id="guest-loading">
    <div class="loading-logo"><img src="/assets/logo.png" alt="Pok Aji Mat Mascot"></div>
    <div class="spinner-border" role="status"><span class="visually-hidden">Loading…</span></div>
    <div class="loading-text">POK AJI MAT TOUR</div>
  </div>

  <!-- Guest Shell (full-screen) -->
  <div id="guest-shell">
    <!-- 360° Panorama canvas -->
    <div id="pano-container"></div>

    <!-- Top branding bar -->
    <div id="guest-topbar">
      <div class="d-flex align-items-center gap-2">
        <img src="/assets/logo.png" alt="Pok Aji Mat logo" style="width: 34px; height: 34px; object-fit: contain;">
        <div class="tour-title" style="margin-bottom: 0;">Pok Aji <span>Mat</span></div>
      </div>
    </div>

    <!-- Current room badge -->
    <div id="current-room-badge">Loading…</div>

    <!-- Autorotate toggle -->
    <button id="btn-guest-autorotate" title="Toggle auto-rotate"><i class="bi bi-arrow-repeat"></i></button>

    <!-- Audio Playback Toggle Button (hidden by default) -->
    <button id="btn-guest-audio" class="d-none" title="Background Music"><i class="bi bi-volume-mute-fill"></i></button>

    <!-- Hidden audio element -->
    <audio id="guest-audio" autoplay loop></audio>

    <!-- Comments Toggle Button -->
    <button id="btn-guest-comments" title="Toggle comments"><i class="bi bi-chat-dots-fill"></i></button>

    <!-- Comments Panel Overlay -->
    <div id="guest-comments-panel" class="guest-comments-panel">
      <div class="panel-header">
        <h5>Guest Comments</h5>
        <button id="btn-close-comments"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="panel-body">
        <div id="comments-list" class="comments-list">
          <div class="text-center py-4" style="color: #6b5a48; font-size: 0.85rem;">No comments yet. Be the first!</div>
        </div>
        <form id="form-post-comment" class="mt-3">
          <div class="mb-2">
            <input type="text" id="comment-author" class="form-control form-control-sm" placeholder="Your Name (optional)" />
          </div>
          <div class="mb-2">
            <textarea id="comment-text" class="form-control form-control-sm" rows="2" placeholder="Write a comment..." required></textarea>
          </div>
          <button type="submit" class="btn btn-xs btn-primary w-100 mt-1">Post Comment</button>
        </form>
      </div>
    </div>

    <!-- Room Navigation -->
    <div id="room-nav-container">
      <button id="btn-toggle-rooms" title="Rooms menu">
        <i class="bi bi-layout-text-sidebar-reverse"></i>
      </button>
      <div class="guest-room-nav" id="guest-room-nav"></div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Guest App Entry -->
  <script type="module" src="/src/guest.js"></script>
</body>
</html>
